name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.10

      - name: Check Code Formatting (Ruff)
        run: ruff format --check .

      - name: Run Linter (Ruff)
        run: ruff check .

  security-and-data-protection:
    name: Security & Data Protection Policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets==1.5.0

      - name: Run Data Confidentiality & Protection Policy Check
        run: |
          python scripts/data_protection_check.py --stage ci

  test-suite:
    name: Unit Tests & Analytical Truth (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [lint-and-format, security-and-data-protection]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

  dbt-pipeline:
    name: dbt Models & Data Quality Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [lint-and-format, security-and-data-protection]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic CI Parquet Fixture
        run: |
          mkdir -p target/ci
          python scripts/generate_sample_data.py --output target/ci/sample-dns-30min.parquet --rows 2000 --force

      - name: dbt Build (Models & Data Quality Assertions)
        env:
          DBT_SOURCE_PARQUET: target/ci/sample-dns-30min.parquet
          DBT_DUCKDB_PATH: target/ci/dns_analytics.duckdb
        run: |
          dbt build --project-dir dbt_dns --profiles-dir dbt_dns

  ci-gate:
    name: CI Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: always()
    needs:
      - lint-and-format
      - security-and-data-protection
      - test-suite
      - dbt-pipeline
    steps:
      - name: Validate All Jobs Succeeded
        run: |
          LINT="${{ needs.lint-and-format.result }}"
          SECURITY="${{ needs.security-and-data-protection.result }}"
          TESTS="${{ needs.test-suite.result }}"
          DBT="${{ needs.dbt-pipeline.result }}"

          echo "lint-and-format status: $LINT"
          echo "security-and-data-protection status: $SECURITY"
          echo "test-suite status: $TESTS"
          echo "dbt-pipeline status: $DBT"

          if [ "$LINT" != "success" ] || [ "$SECURITY" != "success" ] || [ "$TESTS" != "success" ] || [ "$DBT" != "success" ]; then
            echo "::error::One or more required CI workflow jobs failed, were cancelled, or were skipped."
            exit 1
          fi

          echo "All required CI jobs succeeded!"
